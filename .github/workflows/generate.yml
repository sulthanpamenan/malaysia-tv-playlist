name: Generate Malaysia TV Net Playlist

on:
  schedule:
    # Berjalan otomatis setiap 3 jam agar token BunnyCDN tidak expired
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Mengambil seluruh riwayat commit agar sinkronisasi rebase lancar

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Generator Script
      run: python generate.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u playlist.txt
        git commit -m "auto: Update Malaysia TV Net Link" || exit 0
        git pull --rebase origin main
        git push origin main
